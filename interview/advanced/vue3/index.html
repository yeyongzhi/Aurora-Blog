<h2 id="md_nav_1">vue3 生命周期概览</h2>
<p><a href="https://cn.vuejs.org/guide/essentials/lifecycle.html#lifecycle-diagram" target="_blank" rel="noopener noreferrer">vue3生命周期官文</a>
每个 Vue 组件实例在创建时都需要经历一系列的初始化步骤，比如设置好<strong>数据侦听，编译模板，挂载实例到 DOM，以及在数据改变时更新 DOM</strong>。
在此过程中，它也会运行被称为<strong>生命周期钩子</strong>的函数，让开发者有机会在特定阶段运行自己的代码。</p>
<blockquote>
<p>请注意：这些钩子应当在组件初始化时被<strong>同步注册</strong>。请不要在异步调用栈中使用它们。</p>
</blockquote>
